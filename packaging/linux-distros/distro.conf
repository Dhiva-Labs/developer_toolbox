# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with the .deb
# (tools/build_deb.sh).

NAME=developer-toolbox       # package name, the same as the .deb's
APP_NAME=DeveloperToolbox    # AppImage file name and display name
GITHUB_REPO=Dhiva-Labs/developer_toolbox
TAG_PREFIX=''                # release tags are 1.0.0, without a v
SUMMARY='Offline-first collection of developer tools'
DESCRIPTION='21 developer tools in one app: JSON formatter/validator, Base64 and URL encoding, regex tester, JWT decoder, UUID and password generators, hash generator, color tools, QR codes, timestamp converter and more. Built with Flutter, Material 3, fully offline.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/developer_toolbox
# The repository has no licence file, so no open-source licence is claimed.
LICENSE=LicenseRef-proprietary
LICENSE_FILE=''

# Files of the .deb tree that the other formats leave out. libdartjni.so
# comes from the jni plugin (an Android dependency); CMake builds it only
# because the CI runner has a JDK, and it links that runner's libjvm.so by
# absolute path. Nothing loads it on desktop Linux, and shipping it would
# make the rpm require a JVM.
EXCLUDE=(usr/lib/developer-toolbox/lib/libdartjni.so)

# rpm: shared-library dependencies are worked out from the ELF files. List
# only what the app runs (tools it executes), as file paths. Hive keeps the
# settings in the XDG Documents folder, which path_provider asks
# `xdg-user-dir` for; without it the app stops before its first frame.
# Flutter's engine also opens libEGL and libGLESv2 at run time (through
# libepoxy, so they are no ELF dependencies): required by capability, which
# libglvnd provides on Fedora and openSUSE alike.
RPM_REQUIRES=(/usr/bin/xdg-user-dir 'libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)')
# Arch: package names, written by hand (Arch has no soname dependencies for
# most libraries). CI's ldd check on archlinux:latest keeps this honest.
ARCH_DEPENDS=(gtk3 xdg-user-dirs libglvnd)
ARCH_INDEPENDENT=0           # 1 for pure-Python/shell packages (noarch / any)

# AppImage (GUI apps): paths relative to the installed tree.
APPIMAGE=1
EXEC=usr/lib/developer-toolbox/developer_toolbox
DESKTOP=usr/share/applications/developer-toolbox.desktop
ICON=usr/share/icons/hicolor/256x256/apps/developer-toolbox.png
APPRUN_ENV=''                # /usr/bin/developer-toolbox is a plain symlink, no env

# Smoke tests run in each distribution container by verify.sh, with a clean
# home directory, as the .deb's smoke run: the window must show (Flutter
# rendered its first frame) and main() must have opened the Hive settings
# box from Dart, which creates settings.hive.
GUI_CMD=developer-toolbox
GUI_ARGS=''
SMOKE_SETUP=''
SMOKE_READY='xdotool search --name developer_toolbox > /dev/null && [ -n "$(find "$HOME" -name settings.hive)" ]'
SMOKE_SECONDS=90
SMOKE_CMD=''
SMOKE_EXPECT=''
