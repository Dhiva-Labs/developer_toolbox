name: Build releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip Windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath developer-toolbox-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: developer-toolbox-windows-x64.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Build .deb
        run: |
          PKG=dist/deb/developer-toolbox_${GITHUB_REF_NAME#v}_amd64
          mkdir -p $PKG/DEBIAN $PKG/usr/lib/developer-toolbox $PKG/usr/bin \
            $PKG/usr/share/applications $PKG/usr/share/icons/hicolor/256x256/apps
          cp -r build/linux/x64/release/bundle/* $PKG/usr/lib/developer-toolbox/
          ln -s /usr/lib/developer-toolbox/developer_toolbox $PKG/usr/bin/developer-toolbox
          cp assets/icon/icon_256.png $PKG/usr/share/icons/hicolor/256x256/apps/developer-toolbox.png
          printf '[Desktop Entry]\nName=Developer Toolbox\nComment=Offline-first collection of developer tools\nExec=developer-toolbox\nIcon=developer-toolbox\nTerminal=false\nType=Application\nCategories=Development;Utility;\n' \
            > $PKG/usr/share/applications/developer-toolbox.desktop
          printf 'Package: developer-toolbox\nVersion: %s\nArchitecture: amd64\nMaintainer: Dhivakar <dhivakar1010@gmail.com>\nDepends: libgtk-3-0, libglib2.0-0, libstdc++6\nSection: devel\nPriority: optional\nDescription: Offline-first collection of developer tools\n' \
            "${GITHUB_REF_NAME#v}" > $PKG/DEBIAN/control
          dpkg-deb --build --root-owner-group $PKG developer-toolbox-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: developer-toolbox-amd64.deb

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
